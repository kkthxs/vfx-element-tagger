name: Core Tests and Packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,hashing]" opencv-python
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q src scripts tests pilot.py
      - run: python pilot.py --help
      - run: python scripts/analyze_gated.py --help
      - run: python scripts/download_models.py --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python scripts/check_release_archives.py --normalize-sdist
      - run: python -m twine check dist/*
